version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# DockFlow — full-stack local development
#
# Services:
#   postgres  — PostgreSQL 16 database
#   api       — Node.js/Express backend  (backend/api)
#   website   — Warehouse web PWA        (frontend/website)
#   mobile    — Expo dev server          (frontend/mobile)
#
# Quick start:
#   cp backend/api/.env.example backend/api/.env       # fill in JWT_SECRET
#   cp frontend/website/.env.example frontend/website/.env
#   cp frontend/mobile/app/.env.example frontend/mobile/app/.env
#   docker compose up --build
#
# Seed the database (after containers are running):
#   docker compose exec api sh -c "cd /app && DATABASE_URL=... pnpm --filter @workspace/scripts run seed"
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dockflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file: backend/api/.env
    ports:
      - "4000:4000"   # REST API
      - "4001:4001"   # local WebSocket (SignalR fallback)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dockflow
      PORT: "4000"
      NODE_ENV: production
      WS_PORT: "4001"

  # ── Warehouse Web (PWA) ─────────────────────────────────────────────────────
  website:
    build:
      context: .
      dockerfile: frontend/website/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  # ── Mobile Expo Dev Server ──────────────────────────────────────────────────
  # Connect via Expo Go on your phone (must be on the same network as the host).
  # For production builds use EAS Build instead.
  mobile:
    build:
      context: .
      dockerfile: frontend/mobile/Dockerfile
    restart: unless-stopped
    network_mode: host   # needed so Metro LAN mode reaches physical devices
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
    profiles:
      - dev              # opt-in: run with `docker compose --profile dev up`

volumes:
  pgdata:
